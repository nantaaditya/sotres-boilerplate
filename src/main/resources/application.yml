server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/sotres}

spring:
  application.name: ${APPLICATION_NAME:sotres-api}
  threads:
    virtual.enabled: ${VIRTUAL_THREAD_ENABLED:true}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/boilerplate}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:changeme}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:60000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:300000}
      connection-test-query: SELECT 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    generate-ddl: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: ${HIBERNATE_FORMAT_SQL:true}

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    org.zalando.logbook: ${ZALANDO_LOG_LEVEL:TRACE}
    org.springframework.jdbc.core: ${JDBC_LOG_LEVEL:INFO}
  file:
    path: ${LOG_PATH:logs/}
  config: classpath:log4j2-spring-${apps.log.log-format}.xml

iso8583.configuration:
  outgoing-protocol: ${OUTGOING_PROTOCOL:REST}
  log:
    default-log-handler-enabled: ${DEFAULT_LOG_HANDLER_ENABLED:true}
    masking-enabled: ${ISO8583_MASKING_ENABLED:true}
    field-description-enabled: ${ISO8583_FIELD_DESCRIPTION_ENABLED:true}
  connection:
    host: ${ISO8583_HOST:127.0.0.1}
    port: ${ISO8583_PORT:13001}
    worker-thread-count: ${ISO8583_WORKER_THREAD_COUNT:100}
    forwarding-institution-id: ${FORWARDING_INSTITUTION_ID:625}
  network:
    reconnect-interval: ${RECONNECT_INTERVAL:60000}
    time-out: ${TIME_OUT_SECOND:15000}
    scheduled-echo-enabled: ${SCHEDULED_ECHO_ENABLED:true}
    echo-interval: ${ECHO_INTERVAL_SECOND:30000}

# Participant Pool Configurations
participant.configuration.pool:
  transaction:
    flight-queue-time-out: ${TRANSACTION_FLIGHT_QUEUE_TIMEOUT:15000}
    message-queue-time-out: ${TRANSACTION_MESSAGE_QUEUE_TIME_OUT:60000}

client:
  registry-type: ${CLIENT_REGISTRY_TYPE:CALLBACK}
  configurations:
    transaction:
      hostname: ${TRANSACTION_CLIENT_HOSTNAME:http://localhost:8080}
      max-connections: ${TRANSACTION_MAX_CONNECTION:50}
      max-idle-time: ${TRANSACTION_MAX_IDLE_TIME:30000}
      max-life-time: ${TRANSACTION_MAX_LIFE_TIME:60000}
      evict-in-background: ${TRANSACTION_EVICT_BACKGROUND:120000}
      pending-acquire-time-out: ${TRANSACTION_PENDING_ACQUIRE_TIMEOUT:3000}
      client-connect-time-out: ${TRANSACTION_CLIENT_CONNECT_TIMEOUT:5000}
      client-read-time-out: ${TRANSACTION_CLIENT_READ_TIMEOUT:10000}
      client-write-time-out: ${TRANSACTION_CLIENT_WRITE_TIMEOUT:10000}
      time-unit: ${TRANSACTION_CLIENT_TIMEUNIT:MILLISECONDS}

# Actuator Configurations
management:
  server.port: ${ACTUATOR_PORT:1000}
  endpoint:
    shutdown.access: ${ACTUATOR_SHUTDOWN:none}
    health.show-details: ${HEALTH_DETAIL:always}
  endpoints:
    web:
      exposure.include: ${ACTUATOR_EXPOSED:*}
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_ENABLED:true}
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    baggage:
      correlation:
        fields: ${TRACING_CORRELATION_FIELDS:x-request-id}
      local-fields: ${TRACING_LOCAL_FIELDS:x-request-id}
      remote-fields: ${TRACING_REMOTE_FIELDS:x-request-id}
    propagation:
      type: w3c, b3, b3_multi
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

apps:
  version: ${APPS_VERSION:1.0.0-SNAPSHOT}
  log:
    enable-metric-log: ${APPS_METRIC_ENABLED:true}
    enable-trace-log: ${APPS_TRACE_ENABLED:true}
    enable-api-log: ${APPS_API_ENABLED:true}
    sensitive-field: ${SENSITIVE_FIELD:cardNo}
    log-format: ${APPS_LOG_LEVEL:json}
    ignored-path: ${APPS_IGNORED_PATH:/actuator/**,/internal-api/**}
  retry.configurations:
    transaction:
      type: ${TRANSACTION_RETRY_TYPE:EXPONENTIAL_RANDOM}
      initial-interval: ${TRANSACTION_RETRY_INITIAL_INTERVAL:500}
      multiplier: ${TRANSACTION_RETRY_MULTIPLIER:2.0}
      max-interval: ${TRANSACTION_RETRY_MAX_INTERVAL:10000}
      # 1 = single execution, no retry. Raise ONLY if the downstream dedupes on x-request-id (RRN).
      max-attempt: ${TRANSACTION_RETRY_MAX_ATTEMPT:1}
      dead-letter-enabled: ${TRANSACTION_RETRY_DEAD_LETTER:true}
      retryable-exceptions: ${TRANSACTION_RETRYABLE_EXCEPTIONS:org.springframework.web.client.ResourceAccessException:true}
  async.configurations:
    default:
      core-pool-size: ${ASYNC_CORE_POOL_SIZE:5}
      max-pool-size: ${ASYNC_MAX_POOL_SIZE:25}
      queue-capacity: ${ASYNC_QUEUE_CAPACITY:50}
      keep-alive-seconds: ${ASYNC_KEEP_ALIVE_SECONDS:30}
      thread-name-prefix: ${ASYNC_THREAD_NAME_PREFIX:default-async-}
      virtual-thread-enabled: ${ASYNC_VIRTUAL_THREAD_ENABLED:true}
      rejection-policy: ${ASYNC_REJECTION_POLICY:CALLER_RUNS}
    isoTransaction:
      core-pool-size: ${TRANSACTION_CORE_POOL_SIZE:25}
      max-pool-size: ${TRANSACTION_MESSAGE_POOL:90}
      queue-capacity: ${TRANSACTION_QUEUE_SIZE:10}
      keep-alive-seconds: ${TRANSACTION_KEEP_ALIVE_SECONDS:60}
      thread-name-prefix: ${TRANSACTION_PREFIX:iso-transaction-}
      virtual-thread-enabled: ${ISO_TRANSACTION_VIRTUAL_THREAD_ENABLED:true}
      rejection-policy: ${ISO_TRANSACTION_REJECTION_POLICY:ABORT}
    isoTransactionResponse:
      core-pool-size: ${TRANSACTION_RESPONSE_CORE_POOL_SIZE:5}
      max-pool-size: ${TRANSACTION_RESPONSE_MESSAGE_POOL:20}
      queue-capacity: ${TRANSACTION_RESPONSE_QUEUE_SIZE:5}
      keep-alive-seconds: ${TRANSACTION_RESPONSE_KEEP_ALIVE_SECONDS:60}
      thread-name-prefix: ${TRANSACTION_RESPONSE_PREFIX:iso-transaction-response-}
      virtual-thread-enabled: ${ISO_TRANSACTION_RESPONSE_VIRTUAL_THREAD_ENABLED:true}
      rejection-policy: ${ISO_TRANSACTION_RESPONSE_REJECTION_POLICY:ABORT}
  bulkhead.configurations:
    isoTransaction:
      headroom: ${ISO_TRANSACTION_INFLIGHT_HEADROOM:10}
      fair: ${ISO_TRANSACTION_INFLIGHT_FAIR:false}
  cache.configurations:
    context:
      expire-after-write-seconds: ${CONTEXT_CACHE_TTL_SECONDS:60}
    additionalContext:
      expire-after-write-seconds: ${ADDITIONAL_CONTEXT_CACHE_TTL_SECONDS:60}
    jslt:
      maximum-size: ${JSLT_CACHE_SIZE:100}

